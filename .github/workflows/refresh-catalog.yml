# Weekly: re-read catalog.umt.edu and commit the updated snapshot.
# The push makes Render redeploy, so the server starts with fresh data.
name: Refresh catalog snapshot
on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node catalog.js
      - name: Commit if the catalog changed
        run: |
          node -e "const d=require('./data/catalog.json'); if(d.courses.length<1000||d.programs.length<100){console.error('Crawl looks incomplete; not committing');process.exit(1)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet || git commit -m "Refresh UM catalog snapshot"
          git push
