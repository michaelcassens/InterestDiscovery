# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: um-pathfinder
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://michaelcassens.github.io
      - key: CATALOG_MAX_AGE_DAYS
        value: "7"
